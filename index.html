<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- DISPLAY -->
        <div class="display">
            <button class="history-btn">◴</button>

            <div class="display-number">
                0
            </div>
        </div>


        <!-- TOMBOL KALKULATOR -->
        <div class="buttons">

            <!-- BARIS MEMORY -->
            <button class="btn memory">M+</button>
            <button class="btn memory">M-</button>
            <button class="btn memory">MRC</button>
            <button class="btn memory">GT</button>
            <button class="btn memory">AC</button>


            <!-- BARIS 7 8 9 -->
            <button class="btn number">7</button>
            <button class="btn number">8</button>
            <button class="btn number">9</button>
            <button class="btn operator">÷</button>
            <button class="btn operator">%</button>


            <!-- BARIS 4 5 6 -->
            <button class="btn number">4</button>
            <button class="btn number">5</button>
            <button class="btn number">6</button>
            <button class="btn operator">×</button>
            <button class="btn operator">MU</button>


            <!-- BARIS 1 2 3 -->
            <button class="btn number">1</button>
            <button class="btn number">2</button>
            <button class="btn number">3</button>
            <button class="btn operator">-</button>

            <!-- TOMBOL = -->
            <button class="btn equal">=</button>


            <!-- BARIS BAWAH -->
            <button class="btn number">0</button>
            <button class="btn number">00</button>
            <button class="btn number">.</button>
            <button class="btn plus">+</button>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
